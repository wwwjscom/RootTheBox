{% extends "../main.html" %}

{% block title %}{{ _("First Login") }}{% end %}

{% block header %}
<script src="/static/vendor/jquery.terminal/jquery.terminal.min.js" type="text/javascript"></script>
<script src="/static/js/pages/missions/firstlogin.js" type="text/javascript"></script>
<link href="/static/vendor/jquery.terminal/jquery.terminal.min.css" rel="stylesheet" />
<link href="/static/css/terminal.css" rel="stylesheet" />
{% end %}

{% block content %}
{% from tornado.options import options %}
<div class="transmission">
    <div class="card card-body">
        <div class="transmission-header">
            <h3><i class="fa fa-globe"></i> {{ _("Incoming Transmission") }}</h3>
            <button id="closebutton" type="button" class="btn-close" aria-label="{{ _('Close') }}"></button>
        </div>
        <div class="terminalbg">
            <div class="terminalimage c-glitch" style="background-image: url('{{ options.story_character }}');">
                <div class="terminalimage c-glitch__img" style="background-image: url('{{ options.story_character }}');"></div>
                <div class="terminalimage c-glitch__img" style="background-image: url('{{ options.story_character }}');"></div>
                <div class="terminalimage c-glitch__img" style="background-image: url('{{ options.story_character }}');"></div>
                <div class="terminalimage c-glitch__img" style="background-image: url('{{ options.story_character }}');"></div>
                <div class="terminalimage c-glitch__img" style="background-image: url('{{ options.story_character }}');"></div>
            </div>
            <div class="terminaloverlay">
                <br/>
                <div id="console" class="consoleview"></div>
            </div>
        </div>
    </div>
</div>
{% end %}
