<nav class="navbar navbar-expand bg-dark rounded" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand">{{ _("PasteBin") }}</a>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" id="create-paste" href="#">{{ _("Create") }}</a></li>
            <li class="nav-item"><a class="nav-link" id="delete-paste" style="cursor: pointer;" data-uuid="{{ paste.uuid }}">{{ _("Delete") }}</a></li>
        </ul>
    </div>
</nav>
<div class="row">
    <div class="col-md-12 card card-body animated fadeIn">
        {% if paste is not None %}
            <h3>{{ paste.name }} - {{ paste.created.strftime("%I:%M%p %x") }}</h3>
            <pre class="bg-dark text-light rounded p-3" style="min-height: unset;">
            {{ paste.contents }}
            </pre>
        {% end %}
    </div>
</div><!--/row-->
