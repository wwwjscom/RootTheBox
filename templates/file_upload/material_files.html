{% extends "../main.html" %}

{% block title %}{{ _("Game Materials") }}{% end %}

{% block header %}
<script src="{{ static_url('js/pages/file_upload/material_files.js') }}"></script>
<script src="{{ static_url('vendor/jstree/jstree.min.js') }}"></script>
<link rel="stylesheet" href="{{ static_url('vendor/jstree/themes/default-dark/style.min.css') }}" />
<link rel="stylesheet" href="{{ static_url('css/icons.css') }}" />
{% end %}

{% block content %}
    <div class="container">
        <h1>
            <i class="fa fa-folder-open-o"></i>
            {{ _("Game Materials") }}
        </h1>
        <br />
        {% if errors != None and len(errors) != 0 %}
          {% for error in errors %}
              <div class="alert alert-danger alert-dismissible">
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                <h4 class="alert-heading">{{ _("ERROR") }}</h4>
                {{ error }}
              </div>
          {% end %}
        {% end %}
        <div class="card card-body">
            <div id="container" data-subdir="{{ subdir }}">
            </div>
        </div>
    </div>
{% end %}
